name = "nexus-dashboard"
main = "nexus-dashboard-worker.js"
compatibility_date = "2026-08-08"

[[r2_buckets]]
binding = "NEXUS_BUCKET"
bucket_name = "nexus"

[[routes]]
pattern = "nexus.bings.app/*"
zone_name = "bings.app"

[vars]
NEXUS_STATUS_SOURCE_URL = "https://nexus-global-api.bings.app/api/dashboard-status"
