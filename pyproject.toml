[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-control-plane"
version = "5.0.0"
description = "Minimal direct-first multi-device control plane"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
remote = ["mcp[cli]>=1.26,<2", "uvicorn"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["nexus_v5*", "nexus_v3*", "ops*"]
