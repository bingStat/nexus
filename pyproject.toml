[project]
name = "nexus-control-plane"
version = "2.0.0"
description = "Authenticated MCP control plane for the Nexus device cluster"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.27,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
nexus-mcp = "mcp_server.server:main"

[tool.setuptools]
packages = ["mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests_v2"]

[tool.ruff]
line-length = 100
target-version = "py311"
